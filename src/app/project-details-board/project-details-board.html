<div class="board">
    <div class="column" *ngFor="let status of sortedStatuses" cdkDropList
        [cdkDropListData]="ticketsByStatus[status.key]" (cdkDropListDropped)="onDrop($event, status.key)">

        <div class="column-header">
            {{ status.status }}
        </div>

        <div class="column-body">
            <div class="ticket" *ngFor="let ticket of ticketsByStatus[status.key]" cdkDrag>
                {{ ticket.title }}
            </div>
        </div>
    </div>
